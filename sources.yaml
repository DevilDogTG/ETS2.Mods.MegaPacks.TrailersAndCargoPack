# Origin mods merged into this pack. One entry per mod (archives of a multi-file mod listed together).
#
#   id         stable slug; also the extraction folder <root>/local/<id>/<version>/
#   archives   paths relative to megapack.yaml `source_root`
#   origin     where the archive comes from + how `megapack updates` checks it:
#              modland {author, url = mod page} | scsfocus | scs-forum | steam-workshop | local {note}
#   layer      merge order; higher wins on a declared override
#   overrides  source ids or patterns this one may replace files of (collisions auto-resolve)
#
# Not used: the Overweight pack (a strict subset of the main pack, ADR-0001) and Military's Russian variant.
schema: 1

sources:
  - id: jazzycat-trailers-cargo
    name: Trailers and Cargo Pack
    author: Jazzycat
    version: "11.10.6"
    archives:
      - "trailers_and_cargo_pack_by_Jazzycat_v11.10.6_part1.scs"
      - "trailers_and_cargo_pack_by_Jazzycat_v11.10.6_part2.scs"
      - "trailers_and_cargo_pack_by_Jazzycat_v11.10.6_part3.scs"
    origin: { type: modland, author: jazzycat, url: "https://www.modland.net/euro-truck-simulator-2/trailers/trailers-and-cargo-pack-by-jazzycat-13.html" }
    layer: 100

  - id: jazzycat-military
    name: Military Cargo Pack
    author: Jazzycat
    version: "6.8.7"
    archives:
      - "military_cargo_pack_by_Jazzycat_v6.8.7_base.scs"
      - "military_cargo_pack_by_Jazzycat_v6.8.7_eng.scs"
    origin: { type: modland, author: jazzycat, url: "https://www.modland.net/euro-truck-simulator-2/trailers/military-cargo-pack-by-jazzycat-9.html" }
    layer: 110
    # Upstream bug (6.8.7): 26 of 28 traffic trailers (traf/*_traffic.sui) point at trailer folders under their old
    # names; the pack ships them with an `m` suffix (game.log: "load_unit() - Failed to open file", every file
    # present under the new name). The pack does not ship the old folders, so these only redirect references.
    renames:
      "def/vehicle/trailer_jazzy_military/chmzap_938530/": "def/vehicle/trailer_jazzy_military/chmzap938530m/"
      "def/vehicle/trailer_jazzy_military/fliegl_over/": "def/vehicle/trailer_jazzy_military/fliegl_overm/"
      "def/vehicle/trailer_jazzy_military/gal_j/": "def/vehicle/trailer_jazzy_military/gal_jm/"
      "def/vehicle/trailer_jazzy_military/nooteboom/": "def/vehicle/trailer_jazzy_military/nooteboomm/"
      "def/vehicle/trailer_jazzy_military/plat_bort/": "def/vehicle/trailer_jazzy_military/plat_bortm/"
      "def/vehicle/trailer_jazzy_military/tral_j1/": "def/vehicle/trailer_jazzy_military/tral_j1m/"

  - id: jazzycat-military-traffic
    name: Military Cargo Pack (traffic add-on)
    author: Jazzycat
    version: "6.8.7"
    archives: ["military_cargo_pack_by_Jazzycat_traffic_v6.8.7.scs"]
    origin: { type: modland, author: jazzycat, url: "https://www.modland.net/euro-truck-simulator-2/trailers/military-cargo-pack-by-jazzycat-9.html" }
    layer: 111
    targets: { jazzycat-military: "6.8.7" }

  - id: jazzycat-railway
    name: Railway Cargo Pack
    author: Jazzycat
    version: "4.6.7"
    archives: ["railway_cargo_pack_by_Jazzycat_v4.6.7.scs"]
    origin: { type: modland, author: jazzycat, url: "https://www.modland.net/euro-truck-simulator-2/trailers/railway-cargo-pack-by-jazzycat-4.html" }
    layer: 120
    # Its copy of the base game's brick trailer lamp mask differs from vanilla and from Better Flares Traffic Addon's;
    # the megapack loads above Better Flares, so shipping it would hide BF's version. Let BF (or vanilla) win.
    exclude:
      - "vehicle/trailer_eu/brick_trailer/lamp_mask.dds"
      - "vehicle/trailer_eu/brick_trailer/lamp_mask.tobj"
