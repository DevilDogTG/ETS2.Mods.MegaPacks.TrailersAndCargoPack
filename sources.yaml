      - "trailers_and_cargo_pack_by_Jazzycat_v11.10.6_part3.scs"
    origin: { type: modland, author: jazzycat, url: "https://www.modland.net/euro-truck-simulator-2/trailers/trailers-and-cargo-pack-by-jazzycat-13.html" }
    layer: 100

