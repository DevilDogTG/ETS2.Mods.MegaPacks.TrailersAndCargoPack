# Freight-market icon for each Jazzycat cargo. Jazzycat ships none, and the game finds a cargo's icon only
# at /material/ui/cargo_icons/<cargo_id>.mat, so `python tools/cargo_icons.py` writes one alias .mat per cargo into
# overrides/ pointing at a base-game icon texture (vanilla does the same: apples_c.mat -> apples.tobj).
#
# Order: `exact` -> first matching `rules` regex (re.search on the cargo id) -> name stem equals a vanilla cargo
# (apples_j1 -> apples) -> `source` default -> first `groups` entry the cargo has -> `default`.
# Every icon must be a base-game cargo (@included by vanilla def/cargo.sii), never a DLC one: a DLC the player does
# not own would leave the icon missing. The tool fails on any other name. See cargo/icons.md for the result.

exact:
  bell_b45ej: excavator        # Bell B45E articulated dump truck, not a helicopter
  cat_745cj: excavator         # articulated dump truck
  gazonkos_j1: tractors        # lawn mowers
  strau_3401j: tractors        # Strautmann farm trailer
  capspar610j: tractors
  car_acces_j1: truck_rims
  auto_bat_j1: truck_batt
  prokladki_j1: post_packag
  det_eda_j1: packag_food
  det_eda_j2: packag_food
  wat_filt_j1: oil_filters
