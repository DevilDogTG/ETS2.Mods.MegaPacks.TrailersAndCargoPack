# Hand-reviewed fixes of Jazzycat data bugs (ADR-0002), in megapack base_edits format:
#   {path: {unit name: {set: {key: value}}}}
# `tools/cargo_rebalance.py generate` applies these before computing pay, then writes them together with the
# rate changes into cargo/edits.yaml (the file megapack.yaml `base_edits` reads). Edit this file, not edits.yaml.
#
# Rule: keep the cargo's real weight and fix whichever number is wrong. A trailer limit is raised only to fit
# the cargo's full load (limit = chassis + body + units x mass per unit, rounded up to 10 kg), on that cargo's
# own trailer_def, and only where the same trailer carries at least that load in another Jazzycat cargo
# (edk300: maintainer's call, 2026-09-28).

# Decimal slip: 2,026.9 kg per unit = 203 t of bananas per trailer; sister cargo banan_j1 is 215.1 kg/unit.
def/cargo/banan_j2.sui:
  cargo.banan_j2:
    set:
      mass: 202.69

# The cargo asks for body _gooso40ri_c, but its only trailer_def offers _flowersj1: never offered as a job.
def/cargo/flowers_j1.sui:
  cargo.flowers_j1:
    set:
      body_types[]: [_flowersj1]

# ...and its trailer: limit 9,370 kg on a 6,000 kg chassis = 3,370 kg (15 units). The same Ekeri trailer carries
# 21-24 t in other cargoes (9,370 is likely 29,370). Full load 100 x 218.5 = 21,850 kg.
def/cargo/flowers_j1/ekeri_j11.sii:
  trailer_def.flowers_j1.ekeri_j11:
    set:
      gross_trailer_weight_limit: 27850

# Limit 7,020 kg on a 6,600 kg chassis = 420 kg payload (5 forklift units, 1 EUR/km). The same Kögel trailer
# carries 22.6 t (median) to 52 t in other cargoes. Full load 100 x 83.2 = 8,320 kg.
def/cargo/forklift1j/kogel_bort2j.sii:
  trailer_def.forklift1j.kogel_bort2j:
    set:
      gross_trailer_weight_limit: 14920

# M60 tank, 100 x 550 = 55 t, on a trailer limited to 25.1 t (45 units). Same trailer carries up to 74 t.
def/cargo/m60j/over_m3mw.sii:
  trailer_def.m60j.over_m3mw:
    set:
      gross_trailer_weight_limit: 61500

# EDK 300 railway crane, 100 x 450 = 45 t, trailer limited to 22.8 t (50 units). The goldhofer_r never carries
# more than 23 t elsewhere; raised on the maintainer's call (a 45 t crane on a heavy modular trailer is realistic).
def/cargo/edk300/goldhofer_r.sii:
