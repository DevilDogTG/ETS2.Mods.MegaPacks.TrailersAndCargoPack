# MegaPack build configuration — read by the ets2-mod-developer `megapack` skill.
# See docs/adr/ADR-0001-one-megapack-requires-economy.md for why trailers, cargo and traffic ship together.
schema: 1

package:
  name: drivedog_megapack_trailers_cargo  # archive base name: <name>_partN_v<version>.scs
  display_name: "MegaPack: Trailers & Cargo"
  version: "0.1.0-dev.3"                       # megapack's own version, independent of sources
  versioned_filenames: true              # DriveDogs convention (as AI Traffic); each release is a new mod in the mod manager
  author: "DevilDogTG"
  game: ets2                             # ets2 | ats — sources must be for this game
  manifest_template: src/manifest.sii    # per-part manifests are generated from this
  description_template: src/description.txt

# Where the original archives live (sources.yaml `archives` are relative to it). "@trailer_cargo_packs" is this
# machine's folder, set under `## MegaPack Roots` in the profile host file hosts/<hostname>.local.md.
source_root: "@trailer_cargo_packs"

# `megapack updates` scans source_root for newer archive versions and untracked archives.
scan:
  ignore:                                # archives under source_root the megapack deliberately does not use
    - "_archived/*"                      # superseded versions, kept until the maintainer deletes them
    - "overweight_trailers_and_cargo_*"  # subset of the main pack (ADR-0001)
    - "*_rus.scs"                        # Military with Russian cargo names; we use _eng

# Paths dropped from every source before merging (patterns without '/' match archive-root files only).
exclude:
  - "manifest.sii"
  - "*.txt"
  - "*.jpg"
  - "*.png"

# The ETS2 version the pack is built for; its extraction (extract-reference, category base) supplies the company list.
base_game:
  version: "1.61.1.1"
# Drop cargo links for companies the base game does not have (map-mod companies: RusMap `*_ru` and others, ~67k
# of 140k link files). The maintainer runs no map mods. After a game update or a new map DLC: extract, relock.
exclude_unknown_companies: true
# Give Jazzycat's local traffic-trailer variants (`variant[]: .name`) global names, as vanilla does. Otherwise the game
# renames each one and logs "Nameless variant detected" (54% of a test log, which then hit the log size limit).
global_variant_names: true
# Cargo pay follows DriveDogs Economy (ADR-0002): rate changes and data fixes, applied at build to the merged
# Jazzycat files. cargo/edits.yaml is generated by `python tools/cargo_rebalance.py generate` from cargo/fixes.yaml.
base_edits:
  edits: cargo/edits.yaml

parts:
  # No separate def part: every build repacks all parts anyway (ADR-0001), and without it the pack fits 3 archives
  # under the engine's 60k-entries-per-archive limit.
  split_defs: false
  max_part_bytes: 3221225472             # 3 GiB — a 2.98 GB HashFS part passed in game (AiTrafficPack probe)
  max_part_files: 60000                  # per-archive file limit reported by the engine (files + dirs)
  pack_margin: 0.9                       # fill parts to 90% of max_part_bytes by estimate; real size verified after packing
