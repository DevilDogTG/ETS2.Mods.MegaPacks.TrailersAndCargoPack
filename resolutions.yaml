# Decisions for collisions NOT covered by a source's `overrides:`, and the source copy each `overrides/` file that
# replaces a shipped file was made from. Each entry is stamped with the hashes of the files it was decided against;
# a changed hash marks it stale for re-review.
#
#   - path: def/example.sii
#     winner: <source-id>            # or
#     merged: overrides/def/example.sii
#     inputs: { <source-id>: <sha256>, <source-id>: <sha256> }
#     note: why
schema: 1

